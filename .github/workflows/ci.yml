name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            django-version: "3.2"
          - python-version: "3.12"
            django-version: "5.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install editable package
        run: pip install "Django==${{ matrix.django-version }}" -e ".[dev]"

      - name: Run tests
        run: pytest

  quality:
    name: Lint and packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify locale catalog
        run: python -m django compilemessages -l es --ignore=.venv --ignore=venv_demo --ignore=dist
        env:
          DJANGO_SETTINGS_MODULE: django_sifen_catalogs.tests.settings
          PYTHONPATH: src:testapp

      - name: Lint
        run: ruff check .

      - name: Validate demo app
        run: |
          python testapp/manage.py check
          python testapp/manage.py migrate --noinput
          python testapp/manage.py import_sifen_locations

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*
